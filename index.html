<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第一版三消遊戲</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #2b2b2b;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin-top: 50px;
    }
    .score-board {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      width: 400px;
      height: 400px;
      background-color: #4a4a4a;
      border: 8px solid #6c6c6c;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .candy {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      cursor: grab;
      user-select: none;
      transition: transform 0.2s;
    }
    .candy:active {
      cursor: grabbing;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="score-board">分數: <span id="score">0</span></div>
  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const scoreDisplay = document.getElementById('score');
    const width = 8;
    const squares = [];
    let score = 0;

    // 我們用水果 emoji 來當作消除的元素
    const candyColors = ['🍎', '🍊', '🍇', '🍉', '🍌', '🥝'];

    // 1. 建立遊戲棋盤
    function createBoard() {
      for (let i = 0; i < width * width; i++) {
        const square = document.createElement('div');
        square.setAttribute('draggable', true);
        square.setAttribute('id', i);
        square.classList.add('candy');
        let randomColor = Math.floor(Math.random() * candyColors.length);
        square.innerHTML = candyColors[randomColor];
        grid.appendChild(square);
        squares.push(square);
      }
    }
    createBoard();

    // 2. 拖曳機制變數
    let draggedCandy;
    let replacedCandy;

    squares.forEach(square => square.addEventListener('dragstart', dragStart));
    squares.forEach(square => square.addEventListener('dragend', dragEnd));
    squares.forEach(square => square.addEventListener('dragover', e => e.preventDefault()));
    squares.forEach(square => square.addEventListener('dragenter', e => e.preventDefault()));
    squares.forEach(square => square.addEventListener('drop', dragDrop));

    function dragStart() {
      draggedCandy = this;
    }

    function dragDrop() {
      replacedCandy = this;
    }

    function dragEnd() {
      if (!replacedCandy) return;

      // 確認是否為相鄰的方塊（上下左右）
      let draggedId = parseInt(draggedCandy.id);
      let replacedId = parseInt(replacedCandy.id);
      const validMoves = [draggedId - 1, draggedId - width, draggedId + 1, draggedId + width];
      const isValidMove = validMoves.includes(replacedId);

      if (isValidMove) {
        // 交換圖案
        let temp = draggedCandy.innerHTML;
        draggedCandy.innerHTML = replacedCandy.innerHTML;
        replacedCandy.innerHTML = temp;
      }
    }

    // 3. 檢查連線與掉落機制
    function checkRowForThree() {
      for (let i = 0; i < 61; i++) {
        let rowOfThree = [i, i + 1, i + 2];
        let decidedColor = squares[i].innerHTML;
        const isBlank = squares[i].innerHTML === '';
        // 排除換行連線的 bug
        const notValid = [6, 7, 14, 15, 22, 23, 30, 31, 38, 39, 46, 47, 54, 55];
        if (notValid.includes(i)) continue;

        if (rowOfThree.every(index => squares[index].innerHTML === decidedColor && !isBlank)) {
          score += 3;
          scoreDisplay.innerHTML = score;
          rowOfThree.forEach(index => squares[index].innerHTML = '');
        }
      }
    }

    function checkColumnForThree() {
      for (let i = 0; i < 47; i++) {
        let columnOfThree = [i, i + width, i + width * 2];
        let decidedColor = squares[i].innerHTML;
        const isBlank = squares[i].innerHTML === '';

        if (columnOfThree.every(index => squares[index].innerHTML === decidedColor && !isBlank)) {
          score += 3;
          scoreDisplay.innerHTML = score;
          columnOfThree.forEach(index => squares[index].innerHTML = '');
        }
      }
    }

    // 4. 讓上方的水果掉落，並在頂部產生新的
    function moveDown() {
      for (let i = 0; i < 55; i++) {
        if (squares[i + width].innerHTML === '') {
          squares[i + width].innerHTML = squares[i].innerHTML;
          squares[i].innerHTML = '';
        }
        // 如果第一排有空缺，補上新的水果
        const firstRow = [0, 1, 2, 3, 4, 5, 6, 7];
        const isFirstRow = firstRow.includes(i);
        if (isFirstRow && squares[i].innerHTML === '') {
          let randomColor = Math.floor(Math.random() * candyColors.length);
          squares[i].innerHTML = candyColors[randomColor];
        }
      }
    }

    // 每 100 毫秒執行一次檢查
    window.setInterval(function() {
      checkRowForThree();
      checkColumnForThree();
      moveDown();
    }, 100);

  </script>
</body>
</html>
